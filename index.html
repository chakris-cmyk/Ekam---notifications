<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekam Notifications</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --fg: #16202a; --muted: #5c6977; --line: #dde2e8; --grid: #eceff3;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
    --ink4: #0b0b0b; --warn: #fab219; --serious: #ec835a; --ph: #e6eefb; --ph-line: #c5d6f3;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; --serif: Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c; --panel: #1a2029; --fg: #e8ecf1; --muted: #9aa6b4; --line: #2c3541; --grid: #242c36;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
      --ink4: #fff; --ph: #22314a; --ph-line: #34486b; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161c; --panel: #1a2029; --fg: #e8ecf1; --muted: #9aa6b4; --line: #2c3541; --grid: #242c36;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --ink4: #fff; --ph: #22314a; --ph-line: #34486b; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
  .wrap { max-width: 1200px; margin: 0 auto; padding-block: 22px 36px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
  header h1 { font: 400 2rem/1.15 var(--serif); margin: 0; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  footer { font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; margin-top: 10px; }

  /* Top bar: tabs */
  .bar-top { position: sticky; top: 0; z-index: 20; background: var(--bg); padding-top: 6px; display: flex; align-items: flex-end; gap: 14px; border-bottom: 1px solid var(--line); }
  .tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1; min-width: 0; }
  .tabs button { font-size: 13.5px; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 12px; cursor: pointer; white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 6px; }
  .tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); font-weight: 600; }
  .tabs button:focus-visible { outline-offset: -2px; }

  /* Shared pieces */
  .tabpanel { display: flex; flex-direction: column; gap: 26px; }
  section { display: flex; flex-direction: column; gap: 12px; scroll-margin-top: var(--stick, 70px); }
  h2 { font-size: 1.15rem; font-weight: 600; margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
  h2 small { font-size: .8rem; font-weight: 400; color: var(--muted); }
  h3 { font-size: .95rem; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 8px; }
  .ic { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .tile { width: 30px; height: 30px; border-radius: 9px; display: inline-grid; place-items: center; flex: none; color: #fff; }
  .tile svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tile.sm { width: 20px; height: 20px; border-radius: 6px; } .tile.sm svg { width: 12px; height: 12px; }
  .tile.lg { width: 40px; height: 40px; border-radius: 12px; } .tile.lg svg { width: 21px; height: 21px; }
  .tile[data-f="greetings"] { color: var(--ink4); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .m { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .lnk { font: inherit; color: var(--s1); background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; text-align: left; }
  .lnk:hover { text-decoration: underline; }
  .btn { font-size: 12.5px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn .c { color: var(--muted); font-variant-numeric: tabular-nums; }
  .btn.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .btn.on .c { color: inherit; opacity: .7; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }

  /* Overview */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
  .kpi .k { font-size: 12px; color: var(--muted); }
  .kpi .v { font: 400 1.7rem/1.15 var(--serif); font-variant-numeric: tabular-nums; }
  .kpi .n { font-size: 11.5px; color: var(--muted); }
  .fcards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .fcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; text-align: left; cursor: pointer; min-width: 0; }
  .fcard:hover { border-color: var(--fg); }
  .fc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .fc-n { font: 400 1.6rem/1 var(--serif); font-variant-numeric: tabular-nums; }
  .fc-name { font-weight: 600; }
  .fc-sub { font-size: 12px; color: var(--muted); }
  .fc-tap { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; margin-top: 4px; }
  .slot { display: grid; grid-template-columns: 92px 1fr auto; gap: 8px 14px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .slot:first-child { padding-top: 0; } .slot:last-child { border-bottom: 0; padding-bottom: 0; }
  .slot .tm { font: 400 1.1rem/1.25 var(--serif); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .slot .tm.txt { font: 600 12.5px/1.3 var(--sans); white-space: normal; }
  .chipset, .vrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .vrow + .vrow { margin-top: 8px; }
  .grp-l { font-size: 12px; color: var(--muted); width: 120px; flex: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  .chip small { color: var(--muted); font-size: 11.5px; }
  .flag { font-size: 11.5px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .flag i { width: 8px; height: 8px; border-radius: 50%; }
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .day { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 12.5px; }
  .day .dn { font-weight: 600; font-size: 13px; }
  .day .dg { color: var(--muted); }
  .day .chip { display: block; align-self: flex-start; margin-top: 4px; border-radius: 10px; }
  .day .chip .dot { margin-right: 6px; }
  .day .chip small { display: block; }
  .steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .step { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .st-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .step .d { font: 400 1.15rem/1.2 var(--serif); }
  .step .w { font-size: 11.5px; color: var(--muted); margin-left: auto; }
  .step .nm { font-size: 13px; font-weight: 600; }
  .step .o { font-size: 12px; color: var(--muted); }

  /* Notifications */
  .pick { display: flex; flex-wrap: wrap; gap: 6px; }
  .pick button { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 5px; cursor: pointer; white-space: nowrap; }
  .pick button.all { padding-left: 13px; }
  .pick .c { color: var(--muted); font-variant-numeric: tabular-nums; }
  .pick button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .pick button[aria-pressed="true"] .c { color: inherit; opacity: .7; }
  .tools { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-top: -14px; font-size: 12.5px; color: var(--muted); }
  .tools b { color: var(--fg); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); padding: 2px; margin-left: auto; }
  .seg button { font-size: 12px; border: 0; background: none; border-radius: 999px; padding: 3px 11px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--fg); color: var(--bg); }
  .cat { display: flex; flex-direction: column; gap: 36px; }
  .feature { gap: 18px; }
  .fhead { display: flex; align-items: center; gap: 12px; }
  .fhead .lead { margin: 1px 0 0; font-size: 13px; color: var(--muted); }
  .fmeta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: -8px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .rule { margin: -6px 0 0; font-size: 12.5px; background: var(--panel); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; }
  .type { display: flex; flex-direction: column; gap: 8px; scroll-margin-top: var(--stick, 70px); }
  .type-h { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; }
  .note { font-size: 12.5px; color: var(--muted); margin: -2px 0 0; }
  .pushes { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .push { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 11px 13px 7px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .push-top { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); min-height: 20px; }
  .tag { margin-left: auto; font-size: 11px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .push-t { font-weight: 600; font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
  .push-b { font-size: 13px; line-height: 1.4; overflow-wrap: anywhere; flex: 1; }
  .push-f { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
  .push-f code { font-size: 10.5px; color: var(--muted); letter-spacing: .02em; }
  .copy { background: none; border: 0; cursor: pointer; padding: 5px; border-radius: 6px; color: var(--muted); display: inline-grid; }
  .copy:hover { color: var(--fg); background: var(--bg); }
  .ph { font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: .86em; font-weight: 400; background: var(--ph); border: 1px solid var(--ph-line); border-radius: 4px; padding: 0 3px; white-space: nowrap; }
  .ex { background: var(--ph); border-radius: 4px; padding: 0 3px; }

  /* Tables */
  .tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .tw table { min-width: 720px; }
  th, td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.nw { white-space: nowrap; }
  td.mut { color: var(--muted); }
  td .m { color: inherit; font-size: inherit; }
  td .m .ic { color: var(--muted); }
  tr.grp td { background: var(--bg); color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  tr.grp .dot { margin-right: 7px; vertical-align: -1px; }

  /* New-notification form */
  .btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; margin-bottom: 6px; flex: none; }
  dialog { border: 1px solid var(--line); border-radius: 16px; padding: 0; background: var(--panel); color: var(--fg); width: min(880px, calc(100vw - 24px)); max-height: calc(100vh - 24px); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(10, 14, 20, .45); }
  .nf { display: flex; flex-direction: column; gap: 14px; padding: 18px 20px; }
  .nf-head { display: flex; justify-content: space-between; align-items: center; }
  .nf-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; }
  .nf-fields { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .nf-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
  .fld-h { display: flex; justify-content: space-between; gap: 8px; }
  .fld-h b { color: var(--fg); font-variant-numeric: tabular-nums; }
  .fld input, .fld select, .fld textarea { font: inherit; font-size: 13.5px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; }
  .fld textarea { resize: vertical; min-height: 76px; }
  .fld select:disabled { opacity: .6; }
  .newtype { display: flex; flex-direction: column; gap: 10px; border-left: 3px solid var(--line); padding-left: 12px; }
  .phs { display: flex; flex-wrap: wrap; gap: 4px; }
  .phs button { font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 11px; color: var(--fg); background: var(--ph); border: 1px solid var(--ph-line); border-radius: 4px; padding: 1px 5px; cursor: pointer; }
  .nf-prev { display: flex; flex-direction: column; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; align-self: start; font-size: 12px; color: var(--muted); }
  .nf-prev .push { color: var(--fg); }
  .ghost { color: var(--muted); font-weight: 400; }
  .nf-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .nf-foot .hint { margin-right: auto; font-size: 12px; color: var(--muted); }
  .tag.new { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .tag + .tag { margin-left: 0; }
  .acts { display: inline-flex; gap: 2px; }
  .flash { outline: 3px solid var(--s1); outline-offset: 3px; }
  @media (max-width: 700px) { .nf-grid { grid-template-columns: 1fr; } #add-btn { align-self: flex-start; margin: 0; } }

  @media (max-width: 900px) { .fcards { grid-template-columns: repeat(2, minmax(0, 1fr)); } .week { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); } .steps { grid-template-columns: 1fr; } }
  @media (max-width: 700px) {
    .bar-top { position: static; flex-direction: column-reverse; align-items: stretch; gap: 8px; border-bottom: 0; padding-top: 0; }
    .tabs { border-bottom: 1px solid var(--line); }
    .pick { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
    .pick button { flex: none; }
    section, .type { scroll-margin-top: 12px; }
    .grp-l { width: 100%; }
  }
  @media (max-width: 560px) {
    .slot { grid-template-columns: 88px 1fr; } .slot .flag { grid-column: 2; justify-self: start; }
    .slot .chip { flex-wrap: wrap; row-gap: 0; border-radius: 10px; } .slot .chip small { flex-basis: 100%; margin-left: 15px; }
  }
  @media (max-width: 480px) { header h1 { font-size: 1.6rem; } .kpi .v { font-size: 1.4rem; } }
  @media print {
    .bar-top { position: static; } .tabs, .pick, .tools, .copy, #f-kind, #add-btn { display: none !important; }
    .tabpanel[hidden], .feature[hidden] { display: flex !important; } .card, .push, .day, .step { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ekam Notifications</h1>
    <p id="sub"></p>
  </header>

  <div class="bar-top" id="bar-top">
    <div class="tabs" role="tablist" aria-label="Pages" id="tabs">
      <button type="button" role="tab" data-tab="overview">Overview</button>
      <button type="button" role="tab" data-tab="notifications">Notifications</button>
      <button type="button" role="tab" data-tab="schedule">Schedule</button>
    </div>
    <button type="button" class="btn primary" id="add-btn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New notification</button>
  </div>

  <!-- ============ OVERVIEW ============ -->
  <div class="tabpanel" role="tabpanel" data-panel="overview">
    <div class="kpis" id="k-overview"></div>
    <section>
      <h2>Features</h2>
      <div class="fcards" id="fcards"></div>
    </section>
    <section>
      <h2>A day <small>what goes out, and when</small></h2>
      <div class="card" id="agenda"></div>
    </section>
    <section>
      <h2>A week <small>the morning greeting, plus weekly sends</small></h2>
      <div class="week" id="week-grid"></div>
    </section>
    <section>
      <h2>A new user's first 10 days</h2>
      <div class="steps" id="steps"></div>
    </section>
  </div>

  <!-- ============ NOTIFICATIONS ============ -->
  <div class="tabpanel" role="tabpanel" data-panel="notifications" hidden>
    <div class="pick" id="pick" role="group" aria-label="Feature"></div>
    <div class="tools">
      <span id="note"></span>
      <div class="seg" id="f-mode" role="group" aria-label="Copy shows">
        <button type="button" class="on" data-mode="ex">Sample values</button>
        <button type="button" data-mode="ph">Placeholders</button>
      </div>
    </div>
    <div class="cat" id="cat"></div>
  </div>

  <!-- ============ SCHEDULE ============ -->
  <div class="tabpanel" role="tabpanel" data-panel="schedule" hidden>
    <section>
      <div class="presets" id="f-kind" role="group" aria-label="Trigger"></div>
      <div class="tw"><table id="t-sched"><thead></thead><tbody></tbody></table></div>
    </section>
  </div>

  <footer id="foot"></footer>
</div>

<dialog id="dlg" aria-labelledby="dlg-h">
  <form id="nf" class="nf">
    <div class="nf-head">
      <h2 id="dlg-h">New notification</h2>
      <button type="button" class="copy" id="nf-close" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="nf-grid">
      <div class="nf-fields">
        <div class="nf-two">
          <label class="fld">Feature<select id="nf-feature"></select></label>
          <label class="fld">Type<select id="nf-type"></select></label>
        </div>
        <div class="newtype" id="nf-newtype" hidden>
          <label class="fld">Type name<input id="nf-tname" maxlength="60" placeholder="e.g. Ekadashi reminder" autocomplete="off"></label>
          <div class="nf-two">
            <label class="fld">Trigger<select id="nf-tkind"></select></label>
            <label class="fld">When it goes out<input id="nf-twhen" maxlength="80" placeholder="e.g. Daily · 8:00 PM" autocomplete="off"></label>
          </div>
          <label class="fld">Tap opens<input id="nf-topens" maxlength="80" placeholder="Leave empty to use the feature's screen" autocomplete="off"></label>
        </div>
        <label class="fld"><span class="fld-h">Title <span><b id="nf-tc">0</b> characters</span></span><input id="nf-title" required maxlength="120" autocomplete="off"></label>
        <label class="fld"><span class="fld-h">Body <span><b id="nf-bc">0</b> characters</span></span><textarea id="nf-body" required rows="3" maxlength="300"></textarea></label>
        <div class="fld">Insert a value that changes per person or day<div class="phs" id="nf-phs"></div></div>
        <div class="nf-two">
          <label class="fld">Note (optional)<input id="nf-tag" maxlength="40" placeholder="e.g. Lord Shiva" autocomplete="off"></label>
          <label class="fld">Written by<input id="nf-by" maxlength="40" autocomplete="off"></label>
        </div>
      </div>
      <div class="nf-prev">Preview<div id="nf-preview"></div></div>
    </div>
    <div class="nf-foot">
      <span class="hint" id="nf-hint"></span>
      <button type="button" class="btn" id="nf-cancel">Cancel</button>
      <button type="submit" class="btn on" id="nf-save">Save notification</button>
    </div>
  </form>
</dialog>

<script>
(function () {
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  const fallback = () => { const ta = document.createElement('textarea'); ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); return Promise.resolve(); };
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(s).catch(fallback);
  return fallback();
}
/* ---------- notifications the team adds on this page ---------- */
const STORE_KEY = 'ekam-notifications-added-v1';
const PREFIX = { panchang: 'PAN', rashi: 'RP', birth: 'RPO', greetings: 'GRT', mantras: 'MAN', gita: 'GITA', wallpapers: 'WAL', ringtones: 'RING' };
let store = { types: [], items: [] }, storeOk = true, editing = null, lastField = null;

function loadStore() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (d && Array.isArray(d.items)) store = { types: Array.isArray(d.types) ? d.types : [], items: d.items };
  } catch (e) { storeOk = false; }
}
function saveStore() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); storeOk = true; } catch (e) { storeOk = false; } return storeOk; }
const phsOf = s => Array.from(new Set((s.match(/\{(\w+)\}/g) || []).map(k => k.slice(1, -1))));

function addType(def) {
  const f = F_BY_ID[def.fid]; if (!f) return null;
  if (TYPE_BY_ID[def.id]) return TYPE_BY_ID[def.id];
  const ty = { id: def.id, name: def.name, kind: KINDS[def.kind] ? def.kind : 'unset', when: def.when || 'Not set', who: ALL_USERS, opens: def.opens || f.tap, key: ['', ''], v: [], f: f, addedType: true };
  f.types.push(ty); TYPES.push(ty); TYPE_BY_ID[ty.id] = ty;
  return ty;
}
function addVariant(rec) {
  const ty = TYPE_BY_ID[rec.typeId]; if (!ty || BY_ID[rec.id]) return null;
  const x = { id: rec.id, t: rec.t, b: rec.b, tag: rec.tag || '', by: rec.by || '', at: rec.at || '', added: true, ty: ty, f: ty.f, phs: phsOf(rec.t + ' ' + rec.b) };
  ty.v.push(x); ALL.push(x); BY_ID[x.id] = x; ty.f.count++;
  return x;
}
function removeVariant(id) {
  const x = BY_ID[id]; if (!x || !x.added) return;
  x.ty.v.splice(x.ty.v.indexOf(x), 1); ALL.splice(ALL.indexOf(x), 1); delete BY_ID[id]; x.f.count--;
  store.items = store.items.filter(r => r.id !== id);
  if (x.ty.addedType && !x.ty.v.length) {
    const ty = x.ty;
    ty.f.types.splice(ty.f.types.indexOf(ty), 1); TYPES.splice(TYPES.indexOf(ty), 1); delete TYPE_BY_ID[ty.id];
    store.types = store.types.filter(d => d.id !== ty.id);
  }
}

    f.commonOpens = f.types.every(t => t.opens === f.types[0].opens);
  });
  renderTop(); renderFeatureCards(); renderDay(); renderCatalogue(); renderSchedule();
  $$('#f-kind .btn').forEach(b => b.classList.toggle('on', b.dataset.kind === state.kind));
  applyFilter();
}

  const f = F_BY_ID[$('#nf-feature').value], t = $('#nf-title').value, b = $('#nf-body').value, tag = $('#nf-tag').value.trim();
  $('#nf-preview').innerHTML = '<article class="push"><div class="push-top">' + tile(f, 'sm') + '<span>Ekam</span>' + (tag ? '<span class="tag">' + esc(tag) + '</span>' : '') + '</div><div class="push-t">' + (t ? copyHtml(t) : '<span class="ghost">Title</span>') + '</div><div class="push-b">' + (b ? copyHtml(b) : '<span class="ghost">Body</span>') + '</div></article>';
  $('#nf-tc').textContent = t.length; $('#nf-bc').textContent = b.length;
}
function openForm(x) {
  editing = x || null;
  $('#dlg-h').textContent = x ? 'Edit notification' : 'New notification';
  $('#nf-save').textContent = x ? 'Save changes' : 'Save notification';
  const fid = x ? x.f.id : (state.feature || FEATURES[0].id);
  $('#nf-feature').value = fid; typeOptions(fid, x ? x.ty.id : null);
  $('#nf-feature').disabled = !!x; $('#nf-type').disabled = !!x;
  $('#nf-title').value = x ? x.t : ''; $('#nf-body').value = x ? x.b : ''; $('#nf-tag').value = x ? x.tag : '';
  let by = ''; try { by = localStorage.getItem(STORE_KEY + '-by') || ''; } catch (e) {}
  $('#nf-by').value = x ? x.by : by;
  $('#nf-tname').value = ''; $('#nf-twhen').value = ''; $('#nf-topens').value = ''; $('#nf-tkind').value = 'fixed';
  $('#nf-hint').textContent = storeOk ? 'Saved in this browser only. Use Export to share it.' : 'This browser is blocking storage, so it will not be kept after a reload.';
  lastField = null; drawPreview();
  const d = $('#dlg'); if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  $('#nf-title').focus();
}
function closeForm() { const d = $('#dlg'); if (d.close) d.close(); else d.removeAttribute('open'); }
function insertPh(k) {
  const el = lastField || $('#nf-body'), txt = '{' + k + '}';
  const s = el.selectionStart == null ? el.value.length : el.selectionStart, e2 = el.selectionEnd == null ? s : el.selectionEnd;
  el.value = el.value.slice(0, s) + txt + el.value.slice(e2);
  el.focus(); el.selectionStart = el.selectionEnd = s + txt.length;
  drawPreview();
}
function saveForm() {
  const t = $('#nf-title').value.trim(), b = $('#nf-body').value.trim(), tag = $('#nf-tag').value.trim(), by = $('#nf-by').value.trim();
  if (!t || !b) return;
  try { localStorage.setItem(STORE_KEY + '-by', by); } catch (e) {}
  let x;
  if (editing) {
    x = editing; x.t = t; x.b = b; x.tag = tag; x.by = by; x.phs = phsOf(t + ' ' + b);
    const r = store.items.filter(i => i.id === x.id)[0]; if (r) { r.t = t; r.b = b; r.tag = tag; r.by = by; }
  } else {
    const fid = $('#nf-feature').value; let typeId = $('#nf-type').value;
    if (typeId === '__new') {
      const name = $('#nf-tname').value.trim(); if (!name) return;
      const base = PREFIX[fid] + '-' + (name.toUpperCase().replace(/[^A-Z0-9]+/g, '').slice(0, 8) || 'NEW');
      let tid = base, k = 2; while (TYPE_BY_ID[tid]) tid = base + (k++);
      const def = { id: tid, fid: fid, name: name, when: $('#nf-twhen').value.trim(), opens: $('#nf-topens').value.trim(), kind: $('#nf-tkind').value };
      addType(def); store.types.push(def); typeId = tid;
    }
    const ty = TYPE_BY_ID[typeId]; let nn = ty.v.length + 1, id = ty.id + '-' + nn;
    while (BY_ID[id]) id = ty.id + '-' + (++nn);
    const rec = { id: id, typeId: typeId, t: t, b: b, tag: tag, by: by, at: new Date().toISOString().slice(0, 10) };
    x = addVariant(rec); store.items.push(rec);
  }
  saveStore(); state.feature = x.f.id; closeForm(); refreshAll(); setTab('notifications', true);
  const el = $('#cat .push[data-id="' + x.id + '"]');
  if (el) { stick(); el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); }
}
function exportNew() {
  const rows = ALL.filter(x => x.added).map(x => ({ id: x.id, feature: x.f.name, type: x.ty.name, when: x.ty.when, tap_opens: x.ty.opens, title: x.t, body: x.b, note: x.tag, written_by: x.by, added_on: x.at }));
  if (!rows.length) return;
  const cols = Object.keys(rows[0]), cell = s => '"' + String(s).replace(/"/g, '""') + '"';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + [cols.join(',')].concat(rows.map(r => cols.map(c => cell(r[c])).join(','))).join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = 'ekam-new-notifications.csv'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

function init() {
  loadStore(); store.types.forEach(addType); store.items.forEach(addVariant);
  $('#nf-feature').innerHTML = FEATURES.map(f => '<option value="' + f.id + '">' + esc(f.name) + '</option>').join('');
  $('#nf-tkind').innerHTML = Object.keys(KINDS).filter(k => k !== 'unset').map(k => '<option value="' + k + '">' + KINDS[k] + '</option>').join('');
  $('#nf-phs').innerHTML = Object.keys(PH).map(k => '<button type="button" data-ph="' + k + '" title="' + esc(PH[k][0]) + '">{' + k + '}</button>').join('');
  renderWeek(); renderJourney(); refreshAll();

  document.addEventListener('click', e => {
    const t = e.target;
    const tab = t.closest('#tabs button'); if (tab) { setTab(tab.dataset.tab); return; }
    if (t.closest('#add-btn')) { openForm(); return; }
    if (t.closest('#nf-cancel') || t.closest('#nf-close')) { closeForm(); return; }
    const ph = t.closest('[data-ph]'); if (ph) { insertPh(ph.dataset.ph); return; }
    const go = t.closest('[data-go]'); if (go) { showFeature(go.dataset.go); return; }
    const pk = t.closest('#pick button'); if (pk) { state.feature = pk.dataset.f; applyFilter(); return; }
    const ty = t.closest('[data-type]'); if (ty) { showFeature(TYPE_BY_ID[ty.dataset.type].f.id, ty.dataset.type); return; }
    const kind = t.closest('#f-kind .btn'); if (kind) { state.kind = kind.dataset.kind; $$('#f-kind .btn').forEach(b => b.classList.toggle('on', b === kind)); applyFilter(); return; }
    const mode = t.closest('#f-mode button'); if (mode) { state.example = mode.dataset.mode === 'ex'; $$('#f-mode button').forEach(b => b.classList.toggle('on', b === mode)); renderCatalogue(); applyFilter(); return; }
    const ed = t.closest('[data-edit]'); if (ed) { openForm(BY_ID[ed.dataset.edit]); return; }
    const del = t.closest('[data-del]');
    if (del) { if (window.confirm('Delete this notification?')) { removeVariant(del.dataset.del); saveStore(); refreshAll(); } return; }
    if (t.closest('#export-new')) { exportNew(); return; }
    const cp = t.closest('[data-copy]');
    if (cp) { const x = BY_ID[cp.dataset.copy]; copyText(x.t + '\n' + x.b).then(() => { cp.innerHTML = ic('check'); setTimeout(() => { cp.innerHTML = ic('copy'); }, 1200); }); }
  });
  $('#nf').addEventListener('submit', e => { e.preventDefault(); saveForm(); });
  $('#nf').addEventListener('input', drawPreview);
  $('#nf-feature').addEventListener('change', () => { typeOptions($('#nf-feature').value); drawPreview(); });
  $('#nf-type').addEventListener('change', syncNewType);
  ['#nf-title', '#nf-body'].forEach(s => $(s).addEventListener('focus', e => { lastField = e.target; }));
  window.addEventListener('resize', stick);

  setTab((location.hash || '').replace('#', '') || 'overview', true);
  stick();
}
init();
})();
</script>
</body>
